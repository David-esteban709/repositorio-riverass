<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hoja de Vida</title>
    <link rel="stylesheet" href="dores.css">
</head>
<body>

    <div class="tarjeta">
        
        <div class="cabecera">
            <h2 class="titulo">HOJA DE VIDA</h2>
            <p class="subtitulo">Formulario de Registro e Información Profesional</p>
        </div>

        <form id="miFormulario" class="formulario">
            
   
            <div class="seccion">
                <h3 class="subtitulo-seccion">1. Datos Personales</h3>
                
                <div class="caja">
                    <label for="nombre" class="etiqueta">Nombre Completo *</label>
                    <input type="text" id="nombre" class="input" placeholder="Ej. David Rivera">
                    <span class="alerta-error" id="errorNombre">Escribe tu nombre completo.</span>
                </div>

                <div class="bloque">
                    <div class="caja">
                        <label for="documento" class="etiqueta">Documento de Identidad *</label>
                        <input type="text" id="documento" class="input" placeholder="1012345678">
                        <span class="alerta-error" id="errorDocumento">Escribe tu documento.</span>
                    </div>

                    <div class="caja">
                        <label for="fechaNac" class="etiqueta">Fecha de Nacimiento</label>
                        <input type="date" id="fechaNac" class="input">
                    </div>
                </div>

                <div class="bloque">
                    <div class="caja">
                        <label for="telefono" class="etiqueta">Teléfono / Celular *</label>
                        <input type="text" id="telefono" class="input" placeholder="300 123 4567">
                        <span class="alerta-error" id="errorTelefono">Escribe tu teléfono.</span>
                    </div>

                    <div class="caja">
                        <label for="correo" class="etiqueta">Correo Electrónico *</label>
                        <input type="email" id="correo" class="input" placeholder="correo@ejemplo.com">
                        <span class="alerta-error" id="errorCorreo">Escribe un correo válido.</span>
                    </div>
                </div>

                <div class="bloque">
                    <div class="caja">
                        <label for="ciudad" class="etiqueta">Ciudad de Residencia</label>
                        <input type="text" id="ciudad" class="input" placeholder="Ej. Bogotá">
                    </div>

                    <div class="caja">
                        <label for="direccion" class="etiqueta">Dirección</label>
                        <input type="text" id="direccion" class="input" placeholder="Calle / Carrera...">
                    </div>
                </div>
            </div>

           
            <div class="seccion">
                <h3 class="subtitulo-seccion">2. Perfil y Formación</h3>
                
                <div class="bloque">
                    <div class="caja">
                        <label for="escolaridad" class="etiqueta">Nivel Académico</label>
                        <select id="escolaridad" class="input">
                            <option value="bachiller">Bachiller / Estudiante</option>
                            <option value="tecnico">Técnico / Tecnólogo</option>
                            <option value="universitario">Pregrado / Universitario</option>
                            <option value="postgrado">Postgrado / Maestría</option>
                        </select>
                    </div>

                    <div class="caja">
                        <label for="rol" class="etiqueta">Especialidad u Ocupación</label>
                        <select id="rol" class="input">
                            <option value="desarrollador">Desarrollador Web</option>
                            <option value="multimedia">Ingeniero / Diseñador Multimedia</option>
                            <option value="gamedev">Desarrollador de Videojuegos</option>
                            <option value="otro">Otro</option>
                        </select>
                    </div>
                </div>

                <div class="bloque">
                    <div class="caja">
                        <label for="ingles" class="etiqueta">Nivel de Inglés</label>
                        <select id="ingles" class="input">
                            <option value="basico">Básico (A1 - A2)</option>
                            <option value="intermedio">Intermedio (B1 - B2)</option>
                            <option value="avanzado">Avanzado (C1 - C2)</option>
                        </select>
                    </div>

                    <div class="caja">
                        <label for="disponibilidad" class="etiqueta">Disponibilidad para Viajar</label>
                        <select id="disponibilidad" class="input">
                            <option value="no">No disponible</option>
                            <option value="si">Sí disponible</option>
                        </select>
                    </div>
                </div>

                <div class="caja">
                    <label for="perfil" class="etiqueta">Resumen del Perfil Profesional *</label>
                    <textarea id="perfil" class="input" rows="4" placeholder="Describe brevemente tus habilidades, intereses y experiencia..."></textarea>
                    <span class="alerta-error" id="errorPerfil">Escribe algo sobre tu perfil.</span>
                </div>
            </div>

            <button type="submit" class="boton">Guardar Hoja de Vida</button>

            <div class="alerta-exito" id="alertaExito">
                ¡Hoja de Vida guardada con éxito!
            </div>
        </form>

        <div class="pie">
            <a href="index.html" class="enlace">Volver al Inicio</a>
        </div>

    </div>

    <script src="funciones.js"></script>
</body>
</html>

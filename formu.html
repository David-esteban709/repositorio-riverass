<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Mi Pagina</title>
    <link rel="stylesheet" type="text/css" href="melo.css">
</head>
<body>

    <div class="contenedor-formulario">
        <h2> Cuéntanos tu Proyecto</h2>
        <p class="subtitulo">Completa los campos para ponernos en contacto.</p>

        <form id="miFormulario">
            <div class="grupo-entrada">
                <label for="nombre">Nombre Completo *</label>
                <input type="text" id="nombre" placeholder="Ej. David Rivera">
                <span class="mensaje-error" id="errorNombre">El nombre es obligatorio.</span>
            </div>

            <div class="grupo-entrada">
                <label for="correo">Correo Electrónico *</label>
                <input type="email" id="correo" placeholder="ejemplo@correo.com">
                <span class="mensaje-error" id="errorCorreo">Introduce un correo válido.</span>
            </div>

            <div class="grupo-entrada">
                <label for="servicio">¿Qué tipo de software necesitas?</label>
                <select id="servicio">
                    <option value="web">Desarrollo Web a la Medida</option>
                    <option value="movil">Aplicación Móvil (iOS/Android)</option>
                    <option value="ia">Inteligencia Artificial/Automatización</option>
                    <option value="otro">Otro Proyecto</option>
                </select>
            </div>

            <div class="grupo-entrada">
                <label for="mensaje">Detalles del Proyecto *</label>
                <textarea id="mensaje" rows="5" placeholder="Describe brevemente tu idea..."></textarea>
                <div class="contador-letras"><span id="contador">0</span> / 500 letras</div>
                <span class="mensaje-error" id="errorMensaje">El mensaje debe tener al menos 20 letras.</span>
            </div>

            <button type="submit" id="btnEnviar">Enviar Mensaje </button>
    
      
            <div class="mensaje-exito" id="alertaExito">Tu mensaje ha sido enviado con exito</div>
        </form>

        
<div class="contenedor-volver">
            <a id="volver" href="index.html">Volver al Inicio</a>
        </div>

    </div>




    <script src="funciones.js"></script>
</body>
</html>
